services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        INTERNAL_API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      API_PORT: 4000
      ML_SERVICE_URL: http://ml:8000
      MONGODB_URI: mongodb://mongo:27017/thermoscan
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      DEFAULT_DATA_MODE: ${DEFAULT_DATA_MODE:-archive}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-15}
    volumes:
      - uploads:/app/data/uploads
      - journal:/app/.runtime
      - raw:/app/data/raw:ro
    depends_on:
      mongo: {condition: service_healthy}
      ml: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
    restart: unless-stopped

  ml:
    build: {context: ., dockerfile: Dockerfile.ml}
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      WORLDPOP_RASTER_URL: ${WORLDPOP_RASTER_URL:-}
      WORLDPOP_YEAR: ${WORLDPOP_YEAR:-}
    volumes:
      - uploads:/app/data/uploads
      - raw:/app/data/raw
      - models:/app/ml/artifacts
      - context-cache:/app/.runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 6
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
  raw:
  models:
  journal:
  context-cache:
